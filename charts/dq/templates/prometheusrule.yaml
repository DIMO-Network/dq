apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "dq.fullname" . }}-alerts
  labels:
    {{- include "dq.labels" . | nindent 4 }}
spec:
  groups:
    - name: dq-query
      rules:
        # Pool saturation (H4): WaitDuration is cumulative seconds spent
        # waiting for a DuckDB connection — the direct signal that queries are
        # queueing on the small pool. Sustained >0.5s of wait per second per
        # pod means the admission cap is doing all the work; add replicas or
        # raise DUCKDB_MAX_CONNS.
        - alert: DQPoolSaturated
          expr: sum by (pod) (rate(dq_db_pool_wait_duration_seconds_total{pool="query"}[5m])) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: DuckDB connection pool is saturated ({{ "{{ $labels.pod }}" }})
            description: Queries are spending significant time queueing for a pooled connection; scale the query fleet or the pool.
        # Load shedding (H4/H11): sustained global-cap rejections mean the
        # fleet is undersized for offered load (the cap is per-pod).
        - alert: DQRequestsShed
          expr: sum(rate(dq_requests_rejected_global_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: requests are being shed by the in-flight cap
            description: The process-wide admission cap is rejecting >1 req/s fleet-wide for 10m — sustained overload, not a burst. Scale out.
        # Error-rate SLI over the gqlgen counter. server-garage's tracer emits the
        # status label as success | with_errors (any response carrying GraphQL errors) —
        # there is no "error" value, so the old status="error" matched nothing and the
        # alert could never fire (C1).
        - alert: DQGraphQLErrorRate
          expr: >-
            (sum(rate(graphql_request_total{status="with_errors"}[10m])) or vector(0))
            / (sum(rate(graphql_request_total[10m])) > 0) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: GraphQL error rate above 5%
            description: More than 5% of GraphQL requests are erroring; check catalog/S3 health and recent deploys.
{{- if (.Values.prometheusRule | default dict).materializerEnabled }}
    # The entire dq-materializer group (its alerts AND the dq:pipeline_snapshot_backlog
    # recording rule) is gated on materializerEnabled (C6): materializer metrics are
    # registered only in the single-writer materializer process (H2), so rendering this
    # group in the query release too produced DUPLICATE recording series and alerts on
    # metrics that release never emits. Only the materializer release sets the flag.
    - name: dq-materializer
      rules:
        - alert: DQMaterializerDecodeLag
          # Keyed off commit lag (decode position), NOT dq_materializer_lag_seconds.
          # That gauge is now − min(event time) over the batch — PRODUCER lateness,
          # and a min at that, so a single hourly-reporting device sets it for ~600
          # rows. On the GCP node it sat at 11–13h through every business day while
          # decode ran seconds behind, so `> 300` fired more or less permanently
          # (measured 2026-07-28: 97.7% of rows arrive within 5min; the 0.8% that
          # are 1–6h old come from 4 of 41 subjects). Same shape as
          # DinSnapshotAgeNearRetention: an alert true by construction teaches the
          # channel to be ignored. Threshold is ~2x the observed daily peak
          # (~50min) and still 36x inside LAKE_SNAPSHOT_RETENTION (72h).
          expr: max(dq_materializer_commit_lag_seconds) > 7200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: materializer decode position is over 2h behind the catalog
            description: >-
              The oldest un-decoded DuckLake snapshot has been waiting over 2h —
              raw events are landing faster than the materializer drains them, so
              queries serve stale data and din's snapshot expiry is held back by
              this consumer floor. The clock runs against LAKE_SNAPSHOT_RETENTION
              (72h), past which the cursor resets and un-decoded data is skipped
              permanently. For how late the PRODUCERS are (a different question),
              see dq_materializer_event_age_seconds.
        - alert: DQMaterializerStalled
          # Label algebra matters here (H1): bare `and` intersects on ALL labels,
          # and rate() over a differently-labeled counter never matches an
          # aggregated max() — the original expression could not fire. Both sides
          # are aggregated to the empty label set and joined `and on()`. The
          # `or vector(0)` keeps the left side alive when the counter has gone
          # stale/absent-but-scraped (a pod that stopped committing entirely).
          # "Pending work" is decode position, not producer lateness: gating on
          # dq_materializer_lag_seconds > 0 tied this alert to whether some device
          # was late rather than to whether anything is waiting to be decoded (and
          # it read 0 while genuinely behind whenever the last batch happened to be
          # all-fresh). commit_lag > 0 is the direct statement.
          expr: (sum(rate(dq_materializer_batches_total[30m])) or vector(0)) == 0 and on() max(dq_materializer_commit_lag_seconds) > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: materializer has pending work but committed no batches in 30m
            description: the materializer cursor is not advancing — decode pipeline is stuck.
        - alert: DQMaterializerDown
          # The single-writer materializer is replicaCount:1 with no PDB. When it
          # is down / Pending after a node drain / CrashLooping, its gauges go
          # ABSENT — so Stalled (rate==0 AND lag>0) and DecodeLag never fire on the
          # missing series. absent_over_time alerts on the absence itself. Rendered
          # only in the materializer release (the whole group is gated), where the
          # gauge is expected.
          expr: absent_over_time(dq_materializer_cursor_snapshot_id[15m])
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: materializer is not reporting (down, CrashLooping, or unscraped)
            description: >-
              No materializer metric scraped for 15m — the single-writer
              materializer is not running. Decode has halted; restart it before
              lag passes LAKE_SNAPSHOT_RETENTION → cursor reset
              (DQMaterializerCursorReset) and permanent data loss.
        - alert: DQMaterializerCursorReset
          expr: increase(dq_materializer_cursor_resets_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: DuckLake materializer skipped an un-decoded snapshot range
            description: >-
              The decode cursor lagged past LAKE_SNAPSHOT_RETENTION; the unretained
              prefix was skipped WITHOUT decoding, so those raw events never reached
              lake.signals/events ({{ "{{ $value }}" }} resets; skipped span in
              dq_materializer_last_cursor_reset_gap_snapshots). RECOVER the gap with
              the backfill tool — run the dq image with
              `-backfill-from <RFC3339> -backfill-to <RFC3339>` covering the skipped
              window (idempotent; safe while the materializer is up) — then raise
              LAKE_SNAPSHOT_RETENTION or decode throughput so it can't recur.
        # Decode-position spread as a single number (CHD-14). NOT an exact
        # backlog: head is the catalog-global max snapshot id, which includes
        # this decoder's own signals/events/rollup snapshots and din's
        # maintenance snapshots, so the value stays non-zero when fully caught
        # up — use it for trend/growth, and dq_materializer_commit_lag_seconds
        # for the decode-lag SLO (that one zeroes on the caught-up branch and is
        # denominated in seconds, so it is comparable to retention; a snapshot
        # COUNT is not — 176 snapshots was ~50min here). Since materializer
        # metrics are registered only in the
        # materializer process (H2), this record is empty (not a misleading 0)
        # while the materializer is down.
        - record: dq:pipeline_snapshot_backlog
          expr: max(dq_materializer_head_snapshot_id) - max(dq_materializer_cursor_snapshot_id)
        # Background-loop failures were only logged, never alerted (SR-14).
        - alert: DQMaterializerPruneErrors
          expr: increase(dq_materializer_prune_errors_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: decoded-retention prune is failing
            description: PruneDecoded errored; decoded tables grow past retention until it recovers.
        # A wedged decode loop spins on the same readDelta/commit/CAS error every
        # pass while the cursor gauge re-publishes unchanged and lag isn't touched —
        # so Down (absent-gauge) and Stalled (lag>0) both miss it. This is the wedge
        # signal (CHD: materializer-liveness).
        - alert: DQMaterializerPassErrors
          expr: increase(dq_materializer_pass_errors_total[15m]) > 5
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: materializer decode loop is failing every pass (likely wedged)
            description: >-
              RunOnce returned errors repeatedly (readDelta/commit/CAS). Decode has
              effectively halted; the cursor/lag gauges can stay flat, so this is the
              only signal. Investigate before lag passes retention (cursor reset).
        # Silent decoded-side data loss was emitted but never alerted: undecodable
        # rows (errors_total) and permanently-missing externalized payloads
        # (blob_missing_total, dropped on S3 404). Mirror of din's poison-row alert.
        - alert: DQMaterializerDecodeErrors
          expr: increase(dq_materializer_errors_total[1h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: materializer is shedding undecodable rows
            description: Conversion failures / undecodable raw events — a producer or schema regression silently drops decoded rows.
        - alert: DQMaterializerBlobMissing
          expr: increase(dq_materializer_blob_missing_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: materializer dropped a permanently-missing blob
            description: A decoded event's externalized payload 404'd on S3 and was skipped — permanent decoded-side data loss. Investigate the blob write path.
        # A deterministic poison blob (oversize / undecryptable / sealed-with-no-key)
        # was skipped so it couldn't wedge the whole delta forever — but that means
        # decoded data was dropped. reason is in the metric label (S6/S7).
        - alert: DQMaterializerBlobPoison
          expr: increase(dq_materializer_blob_poison_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: materializer skipped a poison blob payload
            description: >-
              A decoded event's externalized payload was oversize, undecryptable, or
              sealed with no BLOB_ENCRYPTION_KEY, and was skipped — permanent decoded-side
              data loss. Check the reason label and the blob write/key config.
        # dq's snapshot floor is failing to write to meta.din_consumer_progress while
        # decode keeps succeeding, so dq's own gauges stay green — without this alert the
        # only signal is din's DinConsumerStale ~1h later, which misattributes the cause.
        - alert: DQMaterializerProgressReportErrors
          expr: increase(dq_materializer_progress_report_errors_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: materializer can't write its consumer-progress floor
            description: The meta.din_consumer_progress write is failing; din's snapshot expiry stops advancing for dq. Investigate the dq→catalog write path.
        # A fetch read returned an empty payload because the externalized blob 404'd —
        # the read-path mirror of DQMaterializerBlobMissing (customer got header, no data).
        - alert: DQFetchBlobMissing
          expr: increase(dq_fetch_blob_missing_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: fetch returned an empty payload for a missing blob
            description: A fetch/GraphQL read's externalized payload was permanently missing (S3 404) and was returned empty. Investigate the blob retention/write path.
        # Early warning that the per-batch rollup recompute is growing with
        # history (the SR-1 O(history) cost) before it gates decode throughput.
        - alert: DQMaterializerRollupRefreshSlow
          expr: dq_materializer_rollup_refresh_seconds > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: signals_latest rollup refresh is slow
            description: >-
              The rollup flush exceeds 10s, growing with per-vehicle history.
              It runs off the decode commit but ON the decode-loop goroutine,
              so slow flushes still steal decode time between passes — consider
              the incremental-merge follow-up (SR-1).
        # The rollup flush self-heals on the next pass, but a SUSTAINED failure
        # means latest/summary reads go stale for customers while decode stays
        # green — the counter's help text says to alert on it (M23).
        - alert: DQMaterializerRollupFlushErrors
          expr: increase(dq_materializer_rollup_flush_errors_total[1h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: signals_latest rollup flush is failing
            description: >-
              FlushRollup errored repeatedly; the signals_latest rollup (and the
              latest/summary reads it serves) is going stale while decode keeps
              succeeding. Investigate the rollup write path.
{{- end }}
